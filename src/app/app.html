<div class="h-screen bg-slate-900 text-slate-100 flex flex-col">
  <!-- Header -->
  <header class="px-6 py-4 border-b border-slate-700 flex items-center gap-3 shrink-0">
    <span class="text-slate-100 font-medium tracking-wide">Sorting Network Simulator</span>
    <span class="text-xs text-slate-500 font-mono">v0.1</span>
  </header>

  <!-- Main content -->
  <div class="flex flex-col flex-1 overflow-hidden p-4 gap-3 min-h-0">
    <!-- Top row — canvas takes all available space -->
    <div class="flex gap-4 min-h-0" style="flex: 3">
      <!-- Canvas column -->
      <div class="flex flex-col gap-2 flex-1 min-w-0 min-h-0">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest">Network</span>
        <div class="bg-slate-800 rounded-xl border border-slate-700 flex-1 min-h-0 overflow-hidden">
          <app-network-canvas #canvasPanel [currentStage]="currentStage()" class="block h-full" />
        </div>
        <!-- Stage indicator -->
        <div
          class="bg-slate-800 rounded-lg border border-slate-700 px-4 py-2 flex items-center gap-3 shrink-0"
        >
          <span class="text-xs text-slate-400">Stage</span>
          <span class="font-mono text-sm text-slate-100">
            @if (currentStage() >= depth()) {
              Done
            } @else if (currentStage() === -1) {
              — / {{ depth() }}
            } @else {
              {{ currentStage() + 1 }} / {{ depth() }}
            }
          </span>
          <div class="flex-1 h-1 bg-slate-700 rounded-full overflow-hidden">
            <div
              class="h-full bg-indigo-500 rounded-full transition-all duration-200"
              [style.width.%]="currentStage() === -1 ? 0 : ((currentStage() + 1) / depth()) * 100"
            ></div>
          </div>
        </div>
      </div>

      <!-- Right column -->
      <div class="flex flex-col gap-3 w-[360px] shrink-0 min-h-0">
        <!-- Collapsible config -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shrink-0">
          <button
            type="button"
            (click)="isConfigCollapsed.set(!isConfigCollapsed())"
            class="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-slate-700/50 transition-colors"
          >
            <span class="text-xs font-medium text-slate-400 uppercase tracking-widest"
              >Configuration</span
            >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-slate-400 transition-transform duration-200"
              [class.rotate-180]="isConfigCollapsed()"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          @if (!isConfigCollapsed()) {
            <div class="p-4 pt-0 border-t border-slate-700/50">
              <app-config-panel />
            </div>
          }
        </div>

        <!-- Pseudocode — expands to fill remaining space -->
        <div class="flex flex-col gap-2 flex-1 min-h-0">
          <span class="text-xs font-medium text-slate-400 uppercase tracking-widest"
            >Pseudocode</span
          >
          <div
            class="bg-slate-800 rounded-xl border border-slate-700 flex-1 min-h-0 overflow-hidden"
          >
            <app-pseudocode-panel
              #pseudocodePanel
              [currentExecution]="currentExecution()"
              class="block h-full"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom row — fixed height, never grows -->
    <div class="flex gap-4 shrink-0">
      <div class="flex flex-col gap-2 flex-1 min-w-0">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest"
          >Parallel utilization</span
        >
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4">
          <app-gpu-grid />
        </div>
      </div>
      <div class="flex flex-col gap-2 flex-1 min-w-0">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest">Controls</span>
        <div
          class="bg-slate-800 rounded-xl border border-slate-700 p-4 flex items-center justify-center"
        >
          <app-controls class="w-full" />
        </div>
      </div>
      <div class="flex flex-col gap-2 flex-1 min-w-0">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest">Statistics</span>
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-4">
          <app-statistics />
        </div>
      </div>
    </div>
  </div>
</div>
