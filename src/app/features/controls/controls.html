<div class="controls-wrapper">
  <div class="input-row">
    <button class="btn btn-secondary" (click)="randomize()" title="Randomize input">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="16 3 21 3 21 8" />
        <polyline points="8 21 3 21 3 16" />
        <line x1="21" y1="3" x2="14" y2="10" />
        <line x1="3" y1="21" x2="10" y2="14" />
      </svg>
      Randomize
    </button>
    <button class="btn btn-secondary" (click)="reset()" title="Reset simulation">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="1 4 1 10 7 10" />
        <path d="M3.51 15a9 9 0 1 0 .49-4" />
      </svg>
      Reset
    </button>
  </div>

  <div class="playback-row">
    <button
      class="btn btn-icon"
      (click)="stageBackward()"
      [disabled]="isStart()"
      title="Previous stage"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
      </svg>
    </button>

    <button
      class="btn btn-icon"
      (click)="stepBackward()"
      [disabled]="isStart()"
      title="Previous micro-step"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </button>

    <button
      class="btn btn-play"
      (click)="togglePlay()"
      [disabled]="isEnd()"
      [title]="isPlaying() ? 'Pause' : 'Play'"
    >
      @if (!isPlaying()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z" />
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
      }
    </button>

    <button
      class="btn btn-icon"
      (click)="stepForward()"
      [disabled]="isEnd()"
      title="Next micro-step"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
      </svg>
    </button>

    <button class="btn btn-icon" (click)="stageForward()" [disabled]="isEnd()" title="Next stage">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18l8.5-6L6 6v12zm8.5-6v6h2V6h-2v6z" />
      </svg>
    </button>
  </div>

  <div class="speed-row">
    <span class="speed-label">Speed</span>
    <div class="speed-options">
      @for (opt of SPEED_OPTIONS; track $index; let i = $index) {
        <button class="btn btn-speed" [class.active]="speedIndex() === i" (click)="setSpeed(i)">
          {{ opt.label }}
        </button>
      }
    </div>
  </div>
</div>
